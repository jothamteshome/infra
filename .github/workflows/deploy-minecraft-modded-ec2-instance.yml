name: Deploy Minecraft Modded EC2 Instance

on:
  push:
    branches:
      - main
    paths:
      - 'compose/minecraft/shared/**'
      - 'compose/minecraft/modded/**'
      - '.github/workflows/update-minecraft-ssm-parameters.yml'
      - '.github/workflows/deploy-minecraft-modded-ec2-instance.yml'
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/update-minecraft-ssm-parameters.yml
    with:
      server-type: modded
      hostname: modded.mc.whymighta.net
      java-version: ${{ vars.MINECRAFT_MODDED_JAVA_VERSION }}
    secrets:
      AWS_MINECRAFT_ROLE_TO_ASSUME: ${{ secrets.AWS_MINECRAFT_ROLE_TO_ASSUME }}
      RCON_PASSWORD: ${{ secrets.MINECRAFT_MODDED_RCON_PASSWORD }}
      BACKUP_S3_BUCKET: ${{ vars.MINECRAFT_BACKUP_S3_BUCKET }}
      HOSTED_ZONE_ID: ${{ vars.MINECRAFT_HOSTED_ZONE_ID }}