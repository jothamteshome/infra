name: Deploy Minecraft Vanilla EC2 Instance

on:
  push:
    branches:
      - main
    paths:
      - 'compose/minecraft/shared/**'
      - 'compose/minecraft/vanilla/**'
      - '.github/workflows/update-minecraft-ssm-parameters.yml'
      - '.github/workflows/deploy-minecraft-vanilla-ec2-instance.yml'
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/update-minecraft-ssm-parameters.yml
    with:
      server-type: vanilla
      hostname: vanilla.mc.whymighta.net
    secrets:
      AWS_MINECRAFT_ROLE_TO_ASSUME: ${{ secrets.AWS_MINECRAFT_ROLE_TO_ASSUME }}
      RCON_PASSWORD: ${{ secrets.MINECRAFT_VANILLA_RCON_PASSWORD }}
      BACKUP_S3_BUCKET: ${{ vars.MINECRAFT_BACKUP_S3_BUCKET }}
      HOSTED_ZONE_ID: ${{ vars.MINECRAFT_HOSTED_ZONE_ID }}